<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Geschenkplanner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Geschenkplanner">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Geschenkplanner">
<meta name="theme-color" content="#1f4a36">
<meta name="description" content="Geschenke, Budget & Einkaufsliste für Weihnachten – alles in deinem Browser gespeichert, ohne Konto, ohne Server.">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--bg:#faf5ea;--cd:#fff;--tx:#2a1f1a;--mu:#7a6d63;--rd:#b3262e;--gn:#1f4a36;--gd:#c9a043;--ln:#eadfca;--sh:0 6px 20px #4a2e1214;--hd:'Fraunces',Georgia,serif;--bd:'Inter',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#0e1c15;--cd:#16291f;--tx:#f3ead8;--mu:#a9a08c;--rd:#e0636b;--gn:#6fb58c;--gd:#e3b95a;--ln:#27402f;--sh:0 6px 20px #0006}
html,body{margin:0;max-width:100%;overflow-x:hidden}
body{font:15px/1.5 var(--bd);background:var(--bg);color:var(--tx);padding-bottom:76px}
h1,h2,h3{font-family:var(--hd);margin:0 0 .4em;color:var(--tx)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding:10px 18px;background:var(--cd);border-bottom:1px solid var(--ln)}
.lg{font:600 19px var(--hd);white-space:nowrap}
nav{display:flex;gap:6px;margin:0 auto}
nav button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:99px;padding:7px 13px;font:500 13px var(--bd);cursor:pointer;display:flex;gap:6px;align-items:center}
nav button.on{background:var(--rd);border-color:var(--rd);color:#fff}
.sy{margin-left:auto;font-size:12px;color:var(--gn);white-space:nowrap}
main{max-width:1100px;margin:0 auto;padding:18px}
.hero{border-radius:20px;background:linear-gradient(135deg,var(--cd),var(--bg));border:1px solid var(--ln);box-shadow:var(--sh);padding:0 22px 20px;overflow:hidden;margin-bottom:16px}
.gar{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 0;color:var(--gd)}
.gar i{flex:1;max-width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gd),transparent)}
.gar svg{flex:0 0 auto;width:16px;height:16px;opacity:.85}
.hero small{font:italic 15px var(--hd);color:var(--rd)}.hero h1{font-size:clamp(26px,5vw,38px);margin:0}
.cdn{font:italic 600 19px var(--hd);color:var(--rd);margin-top:6px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:12px}
.card,.kp>div{background:var(--cd);border:1px solid var(--ln);border-radius:16px;box-shadow:var(--sh);padding:14px 16px}
.kp>div{padding:12px 14px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kp span{display:block;font-size:12px;color:var(--mu)}.kp b{font:600 22px var(--hd)}
.ring{text-align:center}.ring svg{width:110px;height:110px}.ring text{font:600 17px var(--hd);fill:var(--tx)}
.rb{fill:none;stroke:var(--ln);stroke-width:7}.rf{fill:none;stroke-width:7;stroke-linecap:round;animation:rg 1s ease-out}
@keyframes rg{from{stroke-dasharray:0 214}}
@media(prefers-reduced-motion:reduce){.rf{animation:none}}
.chart{display:flex;gap:14px;overflow-x:auto;padding:6px 2px}
.bg{text-align:center;min-width:46px}.bp{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:120px}
.bp i{width:15px;border-radius:5px 5px 0 0;min-height:2px;display:block}.gd{background:var(--gd)}.gn{background:var(--gn)}.rd{background:var(--rd)}
.bg small{font-size:11px;color:var(--mu)}
.lgd{font-size:12px;color:var(--mu);margin-top:6px}.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px}
.pb{height:9px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;border-radius:9px;transition:width .6s}
.mu,small{color:var(--mu)}.wa{background:#b3262e1a;color:var(--rd);border-radius:10px;padding:8px 10px;font-weight:600;font-size:13px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tg{font:500 11px var(--bd);font-style:normal;background:var(--ln);border-radius:99px;padding:2px 9px;color:var(--tx)}
.bt,.sm{border:1px solid var(--ln);background:var(--cd);color:var(--tx);border-radius:10px;padding:9px 14px;font:500 14px var(--bd);cursor:pointer}
.sm{padding:5px 10px;font-size:12px}.bt.pr{background:var(--rd);border-color:var(--rd);color:#fff}.sm.rd{color:var(--rd);background:var(--cd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gd);outline-offset:2px}
label{display:block;font-size:13px;font-weight:500;margin-bottom:10px}
input:not([type=checkbox]),select,textarea{width:100%;margin-top:4px;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:15px var(--bd)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ck{display:flex;gap:14px;flex-wrap:wrap}.ck label{display:flex;gap:6px;align-items:center}
.tb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.tb input,.tb select{margin:0}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:12px;color:var(--mu);padding:8px 6px;border-bottom:1px solid var(--ln)}
td{padding:9px 6px;border-bottom:1px solid var(--ln);vertical-align:top}tr.dn td:first-child b,tr.dn td:nth-child(2){text-decoration:line-through;opacity:.6}td small{display:block}
.ov{color:var(--rd);font-weight:600}.pl{border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--ln)}.pl.sVerschenkt{background:var(--gn);color:#fff}.pl.sVerpackt{background:var(--gd);color:#2a1f1a}.pl.sGekauft{background:#b3262e22;color:var(--rd)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px dashed var(--ln)}.li label{margin:0;display:flex;gap:8px;font-weight:400}
.st{color:var(--gd);letter-spacing:2px;font-size:16px}
.ov2{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.mo{background:var(--cd);border-radius:18px;padding:20px;width:100%;max-width:520px;max-height:90vh;overflow:auto}.ac{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
#t{position:fixed;left:0;right:0;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.ts{background:var(--gn);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:var(--sh);font-size:14px;max-width:92%}.ts.er{background:var(--rd)}
.auth{max-width:440px;margin:8vh auto;padding:28px 22px;text-align:center}.auth .bt{width:100%;margin-top:10px}
.sec{margin-bottom:14px}
@media(max-width:760px){
nav{position:fixed;bottom:0;left:0;right:0;margin:0;background:var(--cd);border-top:1px solid var(--ln);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:0;z-index:6}
nav button{flex:1;flex-direction:column;gap:0;border:0;border-radius:10px;font-size:9px;padding:5px 1px;background:none;min-width:0}nav button span{font-size:19px}
.r2{grid-template-columns:1fr}
thead{display:none}tr{display:block;background:var(--cd);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;padding:6px 10px}
td{display:flex;justify-content:space-between;gap:10px;border:0;padding:4px 0;text-align:right}td::before{content:attr(data-l);color:var(--mu);font-size:12px;text-align:left}}
@media print{header,nav,.np,#t{display:none!important}body{background:#fff;color:#000}}
</style></head><body><div id="app"></div><div id="m"></div><div id="t"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem={},ST={get(k){try{return localStorage.getItem(k)}catch(x){return mem[k]??null}},set(k,v){try{localStorage.setItem(k,v)}catch(x){mem[k]=v}},del(k){try{localStorage.removeItem(k)}catch(x){delete mem[k]}}};
let U=JSON.parse(ST.get('wz_u')||'{}'),sid=ST.get('wz_s'),d=null,tab='dash',F={q:'',cat:'',b:'',w:'',s:'',o:''},as={st:0,name:'',mode:''},okfn=null;
const CATS=['Familie','Freunde','Kinder','Kollegen','Partner','Sonstige'],CUR=['EUR','CHF','GBP','USD'],DL=['Persönlich','Post / Paket','Abholung'];
const NAV=[['dash','📊','Dashboard'],['gifts','🎁','Geschenke'],['recips','🧦','Empfänger'],['ideas','💡','Ideenbank'],['shop','🛍️','Einkaufsliste'],['set','⚙️','Einstellungen']];
const uid=()=>Math.random().toString(36).slice(2,9),slug=s=>s.trim().toLowerCase().replace(/\s+/g,'-');
const STAR='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.1 8 7.9 2.1-7.9 2.1-2.1 7.8-2.1-7.8L2 10.1 9.9 8z"/></svg>',DIV=`<div class="gar"><i></i>${STAR}<i></i></div>`;
const sha=async t=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(x){return btoa(unescape(encodeURIComponent(t)))}};
const save=()=>{if(sid)ST.set('wz_d_'+sid,JSON.stringify(d))},saveU=()=>ST.set('wz_u',JSON.stringify(U));
const fm=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:d?d.cur:'EUR'}).format(+n||0);
const fd=s=>new Date(s+'T00:00:00').toLocaleDateString('de-DE',{day:'2-digit',month:'long',year:'numeric'});
const R=id=>d.recips.find(r=>r.id===id),G=()=>d.gifts.filter(g=>!g.arch),spent=rid=>G().filter(g=>g.rid===rid&&g.b).reduce((s,g)=>s+(+g.pr||0),0);
const opt=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join(''),ropt=v=>d.recips.map(r=>`<option value="${r.id}" ${r.id===v?'selected':''}>${E(r.name)}</option>`).join('');
const stat=g=>g.s?'Verschenkt':g.w?'Verpackt':g.b?'Gekauft':'Offen';
const mk=n=>({name:n,date:new Date().getFullYear()+'-12-25',cur:'EUR',dark:matchMedia('(prefers-color-scheme:dark)').matches,recips:[],gifts:[],ideas:[],seasons:[],year:new Date().getFullYear()});
function toast(m,er){const t=document.createElement('div');t.className='ts'+(er?' er':'');t.textContent=m;$('#t').append(t);setTimeout(()=>t.remove(),2800)}
function modal(t,body,ok,lb){$('#m').innerHTML=`<div class="ov2"><div class="mo" role="dialog"><h3>${t}</h3><form id="mf" onsubmit="return false">${body}</form><div class="ac"><button class="bt" data-a="x">Abbrechen</button>${ok?`<button class="bt pr" data-a="ok">${lb||'Speichern'}</button>`:''}</div></div></div>`;okfn=ok}
const fdat=()=>Object.fromEntries(new FormData($('#mf')));
function dl(name,txt,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();toast('Datei wurde exportiert.')}catch(x){toast('Der Export ist hier nicht möglich.',1)}}
function csv(rows){return '\ufeff'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n')}
function render(){document.documentElement.dataset.theme=d&&d.dark?'dark':'light';if(!d)return auth();
$('#app').innerHTML=`<header><div class="lg">Geschenkplanner</div><nav>${NAV.map(n=>`<button data-a="tab" data-i="${n[0]}" class="${tab===n[0]?'on':''}" title="${n[2]}"><span>${n[1]}</span>${n[2]}</button>`).join('')}</nav><span class="sy" id="sy">${navigator.onLine?'● Online':'● Offline'}</span></header><main>${({dash,gifts:giftsV,recips:recV,ideas:ideaV,shop:shopV,set:setV})[tab]()}</main>`;if(tab==='gifts')gt()}
function auth(){const s=as.st;let h='';
if(s===0)h=`${DIV}<h1>Willkommen beim Geschenkplanner!</h1><p class="mu">Plane deine Weihnachtsgeschenke ganz entspannt.</p><label style="text-align:left">Wie heißt du?<input id="nm" placeholder="Dein Vorname" autocomplete="given-name"></label><button class="bt pr" data-a="w1">Weiter</button>`;
else if(s===1)h=`<h1>Hallo, ${E(as.name)}!</h1><p class="mu">Wie möchtest du starten?</p><button class="bt pr" data-a="mo" data-i="new">Neues Konto erstellen</button><button class="bt" data-a="mo" data-i="in">Mit bestehendem Konto anmelden</button><button class="bt" data-a="mo" data-i="loc">Ohne Konto lokal verwenden</button><button class="sm" style="margin-top:14px" data-a="bk">Zurück</button>`;
else h=`<h1>${as.mode==='new'?'Neues Konto':'Anmelden'}</h1><form onsubmit="return false" style="text-align:left"><label>Dein Name<input id="ln" value="${E(as.name)}"></label><label>Passwort<input id="pw" type="password" autocomplete="${as.mode==='new'?'new-password':'current-password'}"></label>${as.mode==='new'?'<label>Passwort wiederholen<input id="p2" type="password"></label><p class="mu" style="font-size:12px">Mindestens 6 Zeichen. Deine Daten bleiben privat auf diesem Gerät.</p>':''}</form><button class="bt pr" data-a="go">${as.mode==='new'?'Konto erstellen':'Anmelden'}</button><button class="sm" style="margin-top:14px" data-a="bk">Zurück</button>`;
$('#app').innerHTML=`<div class="card auth">${h}</div>`}
async function login(id,isNew){sid=id;ST.set('wz_s',id);saveU();d=JSON.parse(ST.get('wz_d_'+id)||'null')||mk(U[id].name);save();tab='dash';render();toast(isNew?'Dein Konto wurde erstellt.':'Willkommen zurück, '+d.name+'!');
if(isNew)modal('Beispielsaison laden?','<p>Möchtest du Beispieldaten (Mama, Papa, Anna, Max, Oma) laden? Du kannst sie jederzeit in den Einstellungen löschen.</p>',()=>{sample();save();render();toast('Beispieldaten wurden geladen.')},'Ja, laden')}
function sample(){const m=(n,c,b)=>({id:uid(),name:n,cat:c,bu:b,ex:1}),r=[m('Mama','Familie',100),m('Papa','Familie',120),m('Anna','Partner',150),m('Max','Kinder',80),m('Oma','Familie',60)];d.recips.push(...r);
const g=(i,n,st,bu,pr,b,w,s,dl)=>({id:uid(),rid:r[i].id,n,st,l:'',bu,pr,b,w,s,dl,ad:'',no:'',up:Date.now()-i*36e5,ex:1});
d.gifts.push(g(0,'Seidenschal','Breuninger',60,58,1,1,0,DL[0]),g(0,'Parfum','Douglas',40,34,1,0,0,DL[0]),g(1,'Lederbrieftasche','Galeria',70,75,1,1,1,DL[0]),g(1,'Grillset','OBI',50,0,0,0,0,DL[0]),g(2,'Armband','Amazon',100,0,0,0,0,DL[1]),g(2,'Wellness-Wochenende','Etsy',50,0,0,0,0,DL[0]),g(3,'LEGO-Set','Lego.com',60,59,1,0,0,DL[1]),g(4,'Strickdecke','Otto',60,0,0,0,0,DL[1]));
d.ideas.push({id:uid(),n:'Kochbuch',w:r[0].id,pr:25,l:'',c:'Familie',p:2,no:'',ex:1});d.sample=1}
function ring(t,ic,n,tot,c){const p=tot?Math.round(n/tot*100):0;return`<div class="card ring"><small>${ic} ${t}</small><svg viewBox="0 0 80 80"><circle class="rb" cx="40" cy="40" r="34"/><circle class="rf" cx="40" cy="40" r="34" stroke="${c}" stroke-dasharray="${213.6*p/100} 214" transform="rotate(-90 40 40)"/><text x="40" y="46" text-anchor="middle">${p}%</text></svg><div><small>${n} von ${tot} erledigt</small></div></div>`}
function dash(){const g=G(),n=g.length,tb=d.recips.reduce((s,r)=>s+(+r.bu||0),0),ts=g.filter(x=>x.b).reduce((s,x)=>s+(+x.pr||0),0),dn=k=>g.filter(x=>x[k]).length,
days=Math.ceil((new Date(d.date+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5),rs=d.recips.map(r=>({r,sp:spent(r.id)})),mx=Math.max(1,...rs.map(x=>Math.max(x.sp,+x.r.bu||0))),over=rs.filter(x=>x.sp>x.r.bu),
todo=g.filter(x=>!x.b),rec=[...g].sort((a,b)=>(b.up||0)-(a.up||0)).slice(0,5),pr=n?Math.round((dn('b')+dn('w')+dn('s'))/(3*n)*100):0;
const cd=days>0?`Noch ${days} ${days===1?'Tag':'Tage'} bis Weihnachten!`:days===0?'Heute ist Weihnachten! 🎅':'Die Weihnachtszeit ist vorbei.';
return`<div class="hero">${DIV}<small>Deine Weihnachtszeit</small><h1>Weihnachten ${new Date(d.date).getFullYear()}</h1><div class="cdn">${cd}</div><small>${fd(d.date)} · Hallo, ${E(d.name)}</small></div>
<div class="kp"><div><span>Gesamtbudget</span><b>${fm(tb)}</b></div><div><span>Bisher ausgegeben</span><b>${fm(ts)}</b></div><div><span>Noch verfügbar</span><b>${fm(tb-ts)}</b></div><div><span>Geschenke gesamt</span><b>${n}</b></div></div>
<div class="g3">${ring('Gekauft','🎁',dn('b'),n,'var(--rd)')}${ring('Verpackt','🎀',dn('w'),n,'var(--gd)')}${ring('Verschickt / Übergeben','🛷',dn('s'),n,'var(--gn)')}</div>
<div class="card sec"><h3>Budget vs. tatsächliche Ausgaben</h3>${rs.length?`<div class="chart">${rs.map(x=>`<div class="bg"><div class="bp"><i class="gd" style="height:${x.r.bu/mx*100}%"></i><i class="${x.sp>x.r.bu?'rd':'gn'}" style="height:${x.sp/mx*100}%"></i></div><small>${E(x.r.name)}</small></div>`).join('')}</div><div class="lgd"><i class="gd"></i>Geplantes Budget<i class="gn"></i>Innerhalb des Budgets<i class="rd"></i>Überschritten</div>`:'<p class="mu">Lege Empfänger an, um den Vergleich zu sehen.</p>'}</div>
<div class="g3"><div class="card"><h3>Budget überschritten</h3>${over.length?over.map(x=>`<p class="wa">${E(x.r.name)}: +${fm(x.sp-x.r.bu)}</p>`).join(''):'<p class="mu">Alles im grünen Bereich. 🎄</p>'}</div>
<div class="card"><h3>Noch zu kaufen</h3>${todo.length?todo.slice(0,5).map(x=>`<div class="li"><span>${E(x.n)} <small>für ${E(R(x.rid)?.name)}</small></span></div>`).join('')+(todo.length>5?`<small>und ${todo.length-5} weitere</small>`:''):'<p class="mu">Alles gekauft! 🎁</p>'}</div>
<div class="card"><h3>Zuletzt aktualisiert</h3>${rec.length?rec.map(x=>`<div class="li"><span>${E(x.n)}</span><span class="pl s${stat(x)}">${stat(x)}</span></div>`).join(''):'<p class="mu">Noch keine Geschenke.</p>'}</div></div>
<div class="card"><h3>Fortschritt der Weihnachtsplanung: ${pr} %</h3><div class="pb"><i class="gn" style="width:${pr}%"></i></div></div>`}
const sel=(f,l,o)=>`<select data-f="${f}" aria-label="${l}"><option value="">${l}</option>${o}</select>`,yn=(f,l)=>sel(f,l+': alle',`<option value="1" ${F[f]==='1'?'selected':''}>${l}</option><option value="0" ${F[f]==='0'?'selected':''}>Nicht ${l.toLowerCase()}</option>`);
function giftsV(){return`<div class="rw"><h2>Geschenke</h2><button class="bt pr" data-a="ga">+ Geschenk hinzufügen</button></div><div class="tb"><input data-f="q" placeholder="Suche nach Empfänger oder Geschenk" value="${E(F.q)}">${sel('cat','Alle Kategorien',CATS.map(c=>`<option ${F.cat===c?'selected':''}>${c}</option>`).join(''))}${yn('b','Gekauft')}${yn('w','Verpackt')}${yn('s','Verschickt')}${sel('o','Sortierung: neueste',['price|Preis','rec|Empfänger','st|Status'].map(x=>x.split('|')).map(x=>`<option value="${x[0]}" ${F.o===x[0]?'selected':''}>${x[1]}</option>`).join(''))}</div><div class="card" id="gt"></div>`}
function gt(){const q=F.q.toLowerCase(),sc=g=>g.s?3:g.w?2:g.b?1:0;let a=G().filter(g=>{const r=R(g.rid)||{};return(!q||(r.name||'').toLowerCase().includes(q)||g.n.toLowerCase().includes(q))&&(!F.cat||r.cat===F.cat)&&['b','w','s'].every(k=>!F[k]||(F[k]==='1')===!!g[k])});
if(F.o==='price')a.sort((x,y)=>(y.pr||0)-(x.pr||0));if(F.o==='rec')a.sort((x,y)=>(R(x.rid)?.name||'').localeCompare(R(y.rid)?.name||'','de'));if(F.o==='st')a.sort((x,y)=>sc(y)-sc(x));
$('#gt').innerHTML=a.length?`<table><thead><tr><th>Empfänger</th><th>Geschenk</th><th>Händler</th><th>Budget</th><th>Preis</th><th>Differenz</th><th>Gekauft</th><th>Verpackt</th><th>Übergeben</th><th>Versandart</th><th>Status</th><th></th></tr></thead><tbody>${a.map(g=>{const r=R(g.rid)||{},df=(g.pr||0)-(g.bu||0),ck=(k,l)=>`<td data-l="${l}"><input type="checkbox" data-ck="${k}" data-i="${g.id}" ${g[k]?'checked':''} aria-label="${l}"></td>`;
return`<tr class="${g.s?'dn':''}"><td data-l="Empfänger"><span><b>${E(r.name)}</b> <em class="tg">${E(r.cat)}</em></span></td><td data-l="Geschenk"><span>${E(g.n)}${g.l?` <a href="${E(g.l)}" target="_blank" rel="noopener">🔗</a>`:''}${g.ad?`<small>📍 ${E(g.ad)}</small>`:''}${g.no?`<small>${E(g.no)}</small>`:''}</span></td><td data-l="Händler">${E(g.st)||'–'}</td><td data-l="Geplant">${fm(g.bu)}</td><td data-l="Preis">${g.pr?fm(g.pr):'–'}</td><td data-l="Differenz" class="${df>0&&g.pr?'ov':''}">${g.pr?(df>0?'+':'')+fm(df):'–'}</td>${ck('b','Gekauft')}${ck('w','Verpackt')}${ck('s','Verschickt / Übergeben')}<td data-l="Versandart">${E(g.dl)}</td><td data-l="Status"><span class="pl s${stat(g)}">${stat(g)}</span></td><td><button class="sm" data-a="ge" data-i="${g.id}">Bearbeiten</button> <button class="sm rd" data-a="gd" data-i="${g.id}">Löschen</button></td></tr>`}).join('')}</tbody></table>`:'<p class="mu">Keine Geschenke gefunden. Füge dein erstes Geschenk hinzu!</p>'}
function gform(id){const g=d.gifts.find(x=>x.id===id)||{};if(!d.recips.length){toast('Bitte lege zuerst einen Empfänger an.',1);tab='recips';return render()}
modal(id?'Geschenk bearbeiten':'Geschenk hinzufügen',`<label>Empfänger<select name="rid">${ropt(g.rid)}</select></label><label>Geschenkname<input name="n" value="${E(g.n)}"></label><div class="r2"><label>Geschäft / Händler<input name="st" value="${E(g.st)}"></label><label>Produktlink<input name="l" value="${E(g.l)}" placeholder="https://"></label></div><div class="r2"><label>Geplantes Budget<input name="bu" type="number" min="0" step="0.01" value="${g.bu??''}"></label><label>Tatsächlicher Preis<input name="pr" type="number" min="0" step="0.01" value="${g.pr??''}"></label></div><div class="r2"><label>Versandart<select name="dl">${opt(DL,g.dl)}</select></label><label>Lieferadresse<input name="ad" value="${E(g.ad)}"></label></div><label>Notizen<textarea name="no" rows="2">${E(g.no)}</textarea></label><div class="ck"><label><input type="checkbox" name="b" ${g.b?'checked':''}>Gekauft</label><label><input type="checkbox" name="w" ${g.w?'checked':''}>Verpackt</label><label><input type="checkbox" name="s" ${g.s?'checked':''}>Verschickt / Übergeben</label></div>`,()=>{const f=fdat();if(!f.n.trim()){toast('Bitte gib einen Geschenknamen ein.',1);return false}
const o={...g,id:g.id||uid(),rid:f.rid,n:f.n.trim(),st:f.st.trim(),l:f.l.trim(),bu:+f.bu||0,pr:+f.pr||0,dl:f.dl,ad:f.ad,no:f.no,b:!!f.b,w:!!f.w,s:!!f.s,up:Date.now()};
if(g.id)Object.assign(g,o);else d.gifts.push(o);save();render();toast(g.id?'Deine Änderungen wurden gespeichert.':'Geschenk erfolgreich hinzugefügt!')})}
function recV(){return`<div class="rw"><h2>Empfänger</h2><button class="bt pr" data-a="ra">+ Empfänger hinzufügen</button></div><div class="grid">${d.recips.map(r=>{const sp=spent(r.id),n=G().filter(g=>g.rid===r.id).length,ov=sp>r.bu;return`<div class="card"><div class="rw"><h3>${E(r.name)}</h3><em class="tg">${E(r.cat)}</em></div><p class="mu">${n} ${n===1?'Geschenk':'Geschenke'} · ${fm(sp)} von ${fm(r.bu)} ausgegeben</p><div class="pb"><i class="${ov?'rd':'gn'}" style="width:${r.bu?Math.min(100,sp/r.bu*100):0}%"></i></div><p>Noch verfügbar: <b>${fm(Math.max(0,r.bu-sp))}</b></p>${ov?'<p class="wa">⚠️ Achtung! Dein Budget für diese Person wurde überschritten.</p>':''}<div class="rw"><button class="sm" data-a="re" data-i="${r.id}">Bearbeiten</button><button class="sm rd" data-a="rd" data-i="${r.id}">Löschen</button></div></div>`}).join('')||'<p class="mu">Noch keine Empfänger. Lege die erste Person an!</p>'}</div>`}
function rform(id){const r=R(id)||{};modal(id?'Empfänger bearbeiten':'Empfänger hinzufügen',`<label>Name<input name="name" value="${E(r.name)}"></label><label>Kategorie<select name="cat">${opt(CATS,r.cat)}</select></label><label>Individuelles Budget<input name="bu" type="number" min="0" step="0.01" value="${r.bu??''}"></label>`,()=>{const f=fdat();if(!f.name.trim()){toast('Bitte gib einen Namen ein.',1);return false}
if(id)Object.assign(r,{name:f.name.trim(),cat:f.cat,bu:+f.bu||0});else d.recips.push({id:uid(),name:f.name.trim(),cat:f.cat,bu:+f.bu||0});save();render();toast(id?'Deine Änderungen wurden gespeichert.':'Empfänger erfolgreich hinzugefügt!')})}
function rdel(id){const r=R(id),gs=G().filter(g=>g.rid===id),oth=d.recips.filter(x=>x.id!==id);
modal('Empfänger löschen',gs.length?`<p>${E(r.name)} hat ${gs.length} Geschenk(e). Was soll damit passieren?</p><label>Geschenke<select name="to"><option value="arch">Archivieren</option>${oth.map(o=>`<option value="${o.id}">Übertragen an ${E(o.name)}</option>`).join('')}</select></label>`:`<p>Möchtest du ${E(r.name)} wirklich löschen?</p>`,()=>{const to=gs.length?fdat().to:'';gs.forEach(g=>{if(to==='arch')g.arch=1;else g.rid=to});d.ideas=d.ideas.filter(i=>i.w!==id);d.recips=d.recips.filter(x=>x.id!==id);save();render();toast('Empfänger wurde gelöscht.')},'Löschen')}
function ideaV(){return`<div class="rw"><h2>Meine Geschenkideen</h2><button class="bt pr" data-a="ia">+ Idee hinzufügen</button></div><p class="mu">Speichere Ideen, bevor du dich zum Kauf entscheidest.</p><div class="grid">${d.ideas.map(i=>`<div class="card"><div class="rw"><h3>${E(i.n)}</h3><span class="st">${'★'.repeat(i.p)+'☆'.repeat(3-i.p)}</span></div><p class="mu">für ${E(R(i.w)?.name||'–')} · ca. ${fm(i.pr)} · ${E(i.c)}</p>${i.l?`<a href="${E(i.l)}" target="_blank" rel="noopener">Produktlink</a>`:''}${i.no?`<p><small>${E(i.no)}</small></p>`:''}<div class="rw"><button class="sm" data-a="ie" data-i="${i.id}">Bearbeiten</button><button class="sm" data-a="im" data-i="${i.id}">Zu Geschenken hinzufügen</button><button class="sm rd" data-a="id" data-i="${i.id}">Entfernen</button></div></div>`).join('')||'<p class="mu">Noch keine Ideen gespeichert.</p>'}</div>`}
function iform(id){const i=d.ideas.find(x=>x.id===id)||{};if(!d.recips.length){toast('Bitte lege zuerst einen Empfänger an.',1);tab='recips';return render()}
modal(id?'Idee bearbeiten':'Idee hinzufügen',`<label>Geschenkname<input name="n" value="${E(i.n)}"></label><div class="r2"><label>Für wen?<select name="w">${ropt(i.w)}</select></label><label>Geschätzter Preis<input name="pr" type="number" min="0" step="0.01" value="${i.pr??''}"></label></div><div class="r2"><label>Kategorie<select name="c">${opt(CATS,i.c)}</select></label><label>Priorität<select name="p">${[1,2,3].map(n=>`<option value="${n}" ${(i.p||2)===n?'selected':''}>${'★'.repeat(n)}</option>`).join('')}</select></label></div><label>Produktlink<input name="l" value="${E(i.l)}" placeholder="https://"></label><label>Notizen<textarea name="no" rows="2">${E(i.no)}</textarea></label>`,()=>{const f=fdat();if(!f.n.trim()){toast('Bitte gib einen Namen für die Idee ein.',1);return false}
const o={n:f.n.trim(),w:f.w,pr:+f.pr||0,c:f.c,p:+f.p,l:f.l.trim(),no:f.no};if(id)Object.assign(i,o);else d.ideas.push({id:uid(),...o});save();render();toast(id?'Deine Änderungen wurden gespeichert.':'Idee erfolgreich gespeichert!')})}
function shopV(){const l=G().filter(g=>!g.b),grp={};l.forEach(g=>(grp[(g.st||'Ohne Händler').toUpperCase()]??=[]).push(g));const tot=l.reduce((s,g)=>s+(+g.pr||+g.bu||0),0);
return`<div class="rw"><h2>Meine Einkaufsliste</h2><div class="np"><button class="bt" data-a="pr">🖨️ Drucken</button> <button class="bt" data-a="sc">CSV-Export</button></div></div><div class="kp"><div><span>Noch zu kaufen</span><b>${l.length}</b></div><div><span>Gesamtkosten offen</span><b>${fm(tot)}</b></div></div>${Object.keys(grp).sort().map(k=>`<div class="card sec"><h3>${E(k)}</h3>${grp[k].map(g=>`<div class="li"><label><input type="checkbox" data-ck="b" data-i="${g.id}"><span>${E(g.n)} <small>für ${E(R(g.rid)?.name)}</small></span></label><b>${fm(g.pr||g.bu)}</b></div>`).join('')}</div>`).join('')||'<div class="card"><p>Alles gekauft – frohe Weihnachten! 🎄</p></div>'}`}
function setV(){const loc=U[sid]?.pw===null;return`<h2>Einstellungen</h2><div class="card sec"><label>Benutzername<input data-s="name" value="${E(d.name)}"></label><div class="r2"><label>Weihnachtsdatum<input type="date" data-s="date" value="${d.date}"></label><label>Währung<select data-s="cur">${opt(CUR,d.cur)}</select></label></div><label>Sprache<select disabled><option>Deutsch</option></select></label><label class="ck"><input type="checkbox" data-s="dark" ${d.dark?'checked':''}> Dunkelmodus</label></div>
<div class="card sec"><h3>Daten</h3><div class="rw"><button class="bt" data-a="ec">CSV-Export</button><button class="bt" data-a="bj">Persönliche Daten exportieren / JSON-Backup</button><label class="bt" style="margin:0">JSON-Backup wiederherstellen<input id="rs" type="file" accept=".json" hidden></label></div>${d.sample?'<p><button class="bt" data-a="ds">Beispieldaten löschen</button></p>':''}</div>
<div class="card sec"><h3>Saisonarchiv</h3><button class="bt pr" data-a="ar">Saison archivieren</button>${d.seasons.map((s,k)=>`<div class="li"><span>${E(s.label)} <small>${s.gifts.length} Geschenke</small></span><button class="sm" data-a="av" data-i="${k}">Ansehen</button></div>`).join('')}</div>
<div class="card sec"><h3>Konto</h3><div class="rw">${loc?'<small>Lokales Konto ohne Passwort</small>':'<button class="bt" data-a="pw">Passwort ändern</button><button class="bt" data-a="lo">Abmelden</button>'}<button class="bt rd" style="color:var(--rd)" data-a="dc">Konto löschen</button></div></div>`}
const A={
x(){$('#m').innerHTML=''},ok(){if(okfn&&okfn()!==false)$('#m').innerHTML=''},tab(i){tab=i;render();scrollTo(0,0)},
w1(){const n=$('#nm').value.trim();if(!n)return toast('Bitte gib deinen Vornamen ein.',1);as.name=n;as.st=1;render()},bk(){as.st=as.st-1;render()},
mo(i){as.mode=i;if(i==='loc'){const id='lokal-'+uid();U[id]={name:as.name,pw:null};return login(id,true)}as.st=2;render()},
async go(){const n=$('#ln').value.trim(),p=$('#pw').value,id=slug(n);if(!n||!p)return toast('Bitte fülle alle Felder aus.',1);
if(as.mode==='new'){if(p.length<6)return toast('Das Passwort muss mindestens 6 Zeichen haben.',1);if(p!==$('#p2').value)return toast('Die Passwörter stimmen nicht überein.',1);if(U[id])return toast('Dieser Name ist bereits vergeben.',1);U[id]={name:n,pw:await sha(p)};login(id,true)}
else{if(!U[id]||U[id].pw!==await sha(p))return toast('Name oder Passwort ist falsch.',1);login(id,false)}},
ga(){gform()},ge(i){gform(i)},gd(i){modal('Geschenk löschen','<p>Möchtest du dieses Geschenk wirklich löschen?</p>',()=>{d.gifts=d.gifts.filter(g=>g.id!==i);save();render();toast('Geschenk wurde gelöscht.')},'Löschen')},
ra(){rform()},re(i){rform(i)},rd(i){rdel(i)},ia(){iform()},ie(i){iform(i)},
id(i){modal('Idee entfernen','<p>Möchtest du diese Idee wirklich entfernen?</p>',()=>{d.ideas=d.ideas.filter(x=>x.id!==i);save();render();toast('Idee wurde entfernt.')},'Entfernen')},
im(i){const x=d.ideas.find(e=>e.id===i);if(G().some(g=>g.rid===x.w&&g.n.toLowerCase()===x.n.toLowerCase()))return toast('Dieses Geschenk existiert bereits in deiner Liste.',1);
d.gifts.push({id:uid(),rid:x.w,n:x.n,st:'',l:x.l,bu:x.pr,pr:0,dl:DL[0],ad:'',no:x.no,b:0,w:0,s:0,up:Date.now()});d.ideas=d.ideas.filter(e=>e.id!==i);save();render();toast('Idee wurde zu den Geschenken hinzugefügt.')},
pr(){try{print()}catch(x){toast('Drucken ist hier nicht möglich.',1)}},
sc(){dl('einkaufsliste.csv',csv([['Händler','Empfänger','Geschenk','Preis'],...G().filter(g=>!g.b).map(g=>[g.st,R(g.rid)?.name,g.n,g.pr||g.bu])]),'text/csv')},
ec(){dl('geschenke.csv',csv([['Empfänger','Kategorie','Geschenk','Händler','Link','Budget','Preis','Gekauft','Verpackt','Übergeben','Versandart','Adresse','Notizen'],...G().map(g=>{const r=R(g.rid)||{};return[r.name,r.cat,g.n,g.st,g.l,g.bu,g.pr,g.b?'Ja':'Nein',g.w?'Ja':'Nein',g.s?'Ja':'Nein',g.dl,g.ad,g.no]})]),'text/csv')},
bj(){dl('weihnachtszauber-backup.json',JSON.stringify(d,null,1),'application/json')},
ds(){modal('Beispieldaten löschen','<p>Alle Beispieldaten werden entfernt. Deine eigenen Einträge bleiben erhalten.</p>',()=>{const ids=d.recips.filter(r=>r.ex).map(r=>r.id);d.recips=d.recips.filter(r=>!r.ex);d.gifts=d.gifts.filter(g=>!g.ex&&!ids.includes(g.rid));d.ideas=d.ideas.filter(i=>!i.ex);d.sample=0;save();render();toast('Beispieldaten wurden gelöscht.')},'Löschen')},
ar(){modal('Saison archivieren',`<p>Die aktuelle Saison wird mit allen Empfängern, Geschenken, Budgets und Status gesichert und bleibt einsehbar. Danach startet eine neue, leere Saison.</p><label class="ck"><input type="checkbox" name="keep" checked> Empfänger ins nächste Jahr übernehmen</label>`,()=>{const k=fdat().keep,c=x=>JSON.parse(JSON.stringify(x));d.seasons.push({label:'Weihnachten '+d.year,recips:c(d.recips),gifts:c(d.gifts),ideas:c(d.ideas)});d.year++;d.date=d.year+'-12-25';d.gifts=[];d.recips=k?d.recips.map(r=>({...r,id:uid(),ex:0})):[];d.ideas=[];save();render();toast('Saison wurde archiviert. Die neue Saison beginnt!')},'Archivieren')},
av(i){const s=d.seasons[i],nm=id=>s.recips.find(r=>r.id===id)?.name||'–',sp=s.gifts.filter(g=>g.b).reduce((a,g)=>a+(+g.pr||0),0);
modal(E(s.label),`<p class="mu">${s.recips.length} Empfänger · ${s.gifts.length} Geschenke · ${fm(sp)} ausgegeben</p>${s.gifts.map(g=>`<div class="li"><span>${E(g.n)} <small>für ${E(nm(g.rid))} · ${stat(g)}</small></span><b>${fm(g.pr||g.bu)}</b></div>`).join('')}`)},
pw(){modal('Passwort ändern','<label>Neues Passwort<input name="p" type="password"></label>',async()=>{const p=fdat().p;if(p.length<6){toast('Das Passwort muss mindestens 6 Zeichen haben.',1);return false}U[sid].pw=await sha(p);saveU();toast('Dein Passwort wurde geändert.')})},
lo(){ST.del('wz_s');sid=null;d=null;as={st:0,name:'',mode:''};render()},

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.i)});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f==='q'){F.q=t.value;gt()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.dataset.ck){const g=d.gifts.find(x=>x.id===t.dataset.i),k=t.dataset.ck,w={b:'gekauft',w:'verpackt',s:'verschickt'}[k];g[k]=t.checked;g.up=Date.now();save();render();toast(t.checked?`Geschenk als ${w} markiert.`:`Markierung „${w}“ wurde entfernt.`)}
else if(t.dataset.f){F[t.dataset.f]=t.value;gt()}
else if(t.dataset.s){const k=t.dataset.s;if(k==='date'&&!t.value)return;d[k]=t.type==='checkbox'?t.checked:t.value.trim()||d[k];if(k==='name'){U[sid].name=d.name;saveU()}save();render();toast('Deine Änderungen wurden gespeichert.')}
else if(t.id==='rs'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const j=JSON.parse(fr.result);if(!Array.isArray(j.recips)||!Array.isArray(j.gifts))throw 0;modal('Backup wiederherstellen','<p>Deine aktuellen Daten werden durch das Backup ersetzt. Fortfahren?</p>',()=>{d={...mk(d.name),...j};save();render();toast('Backup wurde erfolgreich wiederhergestellt.')},'Wiederherstellen')}catch(x){toast('Diese Datei ist kein gültiges Backup.',1)}};fr.readAsText(t.files[0])}});
const ons=()=>{const s=$('#sy');if(s)s.textContent=navigator.onLine?'● Online':'● Offline'};addEventListener('online',()=>{ons();toast('Du bist wieder online.')});addEventListener('offline',()=>{ons();toast('Du bist offline. Deine Daten bleiben gespeichert.')});
if(sid&&U[sid])d=JSON.parse(ST.get('wz_d_'+sid)||'null')||mk(U[sid].name);else sid=null;render();
