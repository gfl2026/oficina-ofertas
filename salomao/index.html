<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>70 Conselhos de Salomão</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F2A44">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Salomão">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#F7F2E7; --surface:#FFFFFF; --border:#E3D9BF;
    --navy:#1F2A44; --navy-soft:#48557A;
    --gold:#B8923F; --gold-soft:#F0E3C0;
    --font-display:'Georgia','Times New Roman',serif;
    --font-body:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{ background:var(--bg); color:var(--navy); font-family:var(--font-body); min-height:100vh; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); box-shadow:0 0 40px rgba(0,0,0,.06); }

  header{ background:var(--navy); color:#fff; padding:18px 20px 14px; text-align:center; position:relative; }
  header .eyebrow{ font-size:11px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; margin-bottom:4px; }
  header h1{ font-family:var(--font-display); font-size:20px; font-weight:normal; }
  header .greet{ font-size:12px; color:var(--gold-soft); margin-top:4px; }
  .streak{ display:inline-flex; align-items:center; gap:6px; background:rgba(184,146,63,.18); border:1px solid var(--gold); border-radius:20px; padding:4px 12px; margin-top:10px; font-size:12px; color:var(--gold-soft); }
  .streak b{ color:#fff; }

  nav.tabs{ display:flex; background:var(--surface); border-bottom:1px solid var(--border); }
  nav.tabs button{ flex:1; padding:12px 4px; background:none; border:none; font-size:13px; color:var(--navy-soft); font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  nav.tabs button.active{ color:var(--navy); border-bottom-color:var(--gold); }

  main{ flex:1; padding:20px; overflow-y:auto; }
  .view{ display:none; }
  .view.active{ display:block; }

  .today-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 22px; text-align:center; box-shadow:0 4px 16px rgba(31,42,68,.06); }
  .today-day{ font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-bottom:10px; }
  .today-cat{ display:inline-block; background:var(--gold-soft); color:#8a6a1f; font-size:11px; padding:3px 10px; border-radius:12px; margin-bottom:14px; }
  .today-text{ font-family:var(--font-display); font-size:19px; line-height:1.5; color:var(--navy); margin-bottom:18px; }
  .today-actions{ display:flex; gap:10px; justify-content:center; }
  .btn{ border:1px solid var(--border); background:#fff; color:var(--navy); padding:9px 16px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600; }
  .btn.fav{ border-color:var(--gold); color:#8a6a1f; }
  .btn.fav.active{ background:var(--gold); color:#fff; }
  .btn.primary{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .reflect{ margin-top:22px; text-align:left; }
  .reflect label{ font-size:12px; color:var(--navy-soft); font-weight:600; display:block; margin-bottom:6px; }
  .reflect textarea{ width:100%; min-height:70px; border:1px solid var(--border); border-radius:10px; padding:10px; font-family:var(--font-body); font-size:13px; resize:vertical; background:#fff; }
  .reflect .saved-note{ font-size:11px; color:var(--gold); margin-top:4px; height:14px; }

  .filters{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .filters button{ font-size:11px; padding:5px 10px; border-radius:14px; border:1px solid var(--border); background:#fff; color:var(--navy-soft); cursor:pointer; }
  .filters button.active{ background:var(--navy); color:#fff; border-color:var(--navy); }

  .list-item{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; }
  .list-item .num{ font-family:var(--font-display); color:var(--gold); font-size:13px; margin-bottom:3px; }
  .list-item .txt{ font-size:13.5px; line-height:1.4; }
  .list-item .star{ font-size:16px; color:var(--border); flex-shrink:0; }
  .list-item .star.active{ color:var(--gold); }
  .empty{ text-align:center; color:var(--navy-soft); font-size:13px; padding:40px 10px; }

  .progress-row{ display:flex; gap:10px; margin-bottom:16px; }
  .progress-stat{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px; text-align:center; }
  .progress-stat .n{ font-family:var(--font-display); font-size:22px; color:var(--navy); }
  .progress-stat .l{ font-size:10px; color:var(--navy-soft); text-transform:uppercase; letter-spacing:1px; }

  /* ---------- top-level pages ---------- */
  .page{ display:none; }
  .page.active{ display:flex; flex-direction:column; gap:22px; }
  nav.subtabs{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; margin-bottom:4px; }
  nav.subtabs button{ flex:1; padding:8px 4px; background:none; border:none; border-radius:7px; font-size:12px; font-weight:600; color:var(--navy-soft); cursor:pointer; }
  nav.subtabs button.active{ background:var(--navy); color:#fff; }

  /* ---------- dashboard (Início) ---------- */
  .greeting{ font-family:var(--font-display); font-size:21px; color:var(--navy); }
  .greeting-sub{ font-size:13px; color:var(--navy-soft); margin-top:3px; }
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .stat-box{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 6px; text-align:center; }
  .stat-box .n{ font-family:var(--font-display); font-size:18px; color:var(--navy); }
  .stat-box .l{ font-size:9px; color:var(--navy-soft); text-transform:uppercase; letter-spacing:.5px; margin-top:2px; line-height:1.3; }
  .moment-card{ background:linear-gradient(160deg,var(--navy),#2b3a5c); color:#fff; border-radius:18px; padding:24px 20px; text-align:center; }
  .moment-card .eyebrow{ font-size:10px; letter-spacing:2px; color:var(--gold-soft); text-transform:uppercase; }
  .moment-card .theme{ font-family:var(--font-display); font-size:19px; margin:8px 0 6px; }
  .moment-card .time{ font-size:12px; color:rgba(255,255,255,.65); margin-bottom:16px; }
  .moment-card button{ background:var(--gold); color:var(--navy); border:none; padding:12px 22px; border-radius:10px; font-weight:700; font-size:13px; cursor:pointer; font-family:var(--font-body); }
  .dash-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; cursor:pointer; }
  .dash-row.soon{ cursor:default; opacity:.6; }
  .dash-row .t{ font-size:14px; font-weight:600; }
  .dash-row .s{ font-size:11px; color:var(--navy-soft); margin-top:2px; }
  .dash-row .tag{ font-size:10px; background:var(--gold-soft); color:#8a6a1f; padding:3px 8px; border-radius:20px; flex-shrink:0; }
  .dash-row .arrow{ color:var(--gold); font-size:16px; flex-shrink:0; }

  /* ---------- Jornada ---------- */
  .journey-day-row{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; }
  .journey-day-row .num{ width:30px; height:30px; border-radius:50%; background:var(--bg); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:13px; flex-shrink:0; }
  .journey-day-row.done .num{ background:var(--gold); color:#fff; border-color:var(--gold); }
  .journey-day-row .info{ flex:1; min-width:0; }
  .journey-day-row .title{ font-size:13.5px; font-weight:600; }
  .journey-day-row .theme{ font-size:11px; color:var(--navy-soft); }
  .journey-day-row .check{ color:var(--gold); font-size:16px; }
  .moment-detail{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; }
  .moment-detail .kicker{ font-size:10px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; margin-bottom:6px; }
  .moment-detail h3{ font-family:var(--font-display); font-size:19px; margin-bottom:14px; }
  .verse-box{ background:var(--gold-soft); border-radius:12px; padding:16px; margin-bottom:16px; }
  .verse-box .txt{ font-family:var(--font-display); font-size:15.5px; line-height:1.5; color:#5a461c; font-style:italic; }
  .verse-box .ref{ font-size:11px; color:#8a6a1f; font-weight:700; margin-top:8px; }
  .verse-box .tr{ font-size:9.5px; color:#8a6a1f; opacity:.75; margin-top:2px; }
  .moment-block{ margin-bottom:16px; }
  .moment-block .lbl{ font-size:10px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--navy-soft); margin-bottom:5px; }
  .moment-block .txt{ font-size:13.5px; line-height:1.55; }
  .moment-block.prayer{ background:var(--bg); border-radius:10px; padding:12px 14px; }
  .moment-detail textarea{ width:100%; min-height:80px; border:1px solid var(--border); border-radius:10px; padding:10px; font-family:var(--font-body); font-size:13px; resize:vertical; background:#fff; }
  .journal-entry{ background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .journal-entry .d{ font-size:10px; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .journal-entry .t{ font-size:13px; margin-top:4px; line-height:1.4; }

  /* ---------- Conquistas ---------- */
  .level-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:22px; text-align:center; }
  .level-card .pts{ font-family:var(--font-display); font-size:30px; color:var(--navy); }
  .level-card .pts-l{ font-size:11px; color:var(--navy-soft); text-transform:uppercase; letter-spacing:1px; }
  .level-card .lvl{ display:inline-block; margin-top:10px; background:var(--gold-soft); color:#8a6a1f; padding:5px 14px; border-radius:20px; font-size:12px; font-weight:700; }
  .badge-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .badge-card{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; text-align:center; opacity:.4; }
  .badge-card.unlocked{ opacity:1; border-color:var(--gold); }
  .badge-card .ic{ width:40px; height:40px; border-radius:50%; background:var(--gold-soft); margin:0 auto 8px; display:flex; align-items:center; justify-content:center; font-family:var(--font-display); font-size:16px; color:#8a6a1f; }
  .badge-card.unlocked .ic{ background:var(--gold); color:#fff; }
  .badge-card .n{ font-size:12px; font-weight:700; }
  .badge-card .d{ font-size:10px; color:var(--navy-soft); margin-top:3px; line-height:1.3; }

  /* ---------- Premium offer / paywall ---------- */
  .prem-back{ background:none; border:none; color:var(--navy-soft); font-size:13px; cursor:pointer; padding:4px 0; text-align:left; align-self:flex-start; }
  .prem-hero{ text-align:center; padding:8px 4px 4px; }
  .prem-hero .eyebrow{ font-size:11px; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
  .prem-hero h2{ font-family:var(--font-display); font-size:24px; color:var(--navy); margin:8px 0 6px; font-weight:normal; }
  .prem-hero p{ font-size:13.5px; color:var(--navy-soft); line-height:1.5; }
  .prem-benefits{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .prem-benefits li{ list-style:none; font-size:13.5px; line-height:1.5; padding-left:24px; position:relative; margin-bottom:10px; }
  .prem-benefits li:last-child{ margin-bottom:0; }
  .prem-benefits li:before{ content:"✓"; color:var(--gold); font-weight:700; position:absolute; left:0; }
  .prem-price-box{ background:var(--navy); color:#fff; border-radius:16px; padding:22px; text-align:center; }
  .prem-price-box .amount{ font-family:var(--font-display); font-size:30px; }
  .prem-price-box .cond{ font-size:11px; color:rgba(255,255,255,.65); margin-top:4px; }
  .prem-price-box button{ margin-top:16px; width:100%; background:var(--gold); color:var(--navy); border:none; padding:14px; border-radius:10px; font-weight:700; font-size:14px; cursor:pointer; font-family:var(--font-body); }
  .prem-price-box button:disabled{ opacity:.55; cursor:default; }
  .prem-note{ font-size:11.5px; color:var(--navy-soft); text-align:center; line-height:1.5; }

  /* ---------- Conta / autenticação ---------- */
  .acct-btn{ position:absolute; top:14px; right:16px; background:rgba(184,146,63,.18); border:1px solid var(--gold); color:var(--gold-soft); font-size:11px; padding:5px 11px; border-radius:20px; cursor:pointer; font-family:var(--font-body); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acct-tabs{ display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:4px; }
  .acct-tabs button{ flex:1; padding:8px; background:none; border:none; border-radius:7px; font-size:12px; font-weight:600; color:var(--navy-soft); cursor:pointer; font-family:var(--font-body); }
  .acct-tabs button.active{ background:var(--navy); color:#fff; }
  .acct-field{ display:flex; flex-direction:column; gap:5px; }
  .acct-field label{ font-size:11px; color:var(--navy-soft); font-weight:600; }
  .acct-error{ font-size:12px; color:#a3372f; background:#fbe9e7; border-radius:8px; padding:9px 12px; }
  .acct-ok{ font-size:12px; color:#2f6a3f; background:#e6f3e8; border-radius:8px; padding:9px 12px; }
  .acct-card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .acct-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid var(--border); }
  .acct-row:last-child{ border-bottom:none; }

  /* ---------- onboarding ---------- */
  .onb{ max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  .onb-progress{ height:4px; background:var(--border); flex-shrink:0; }
  .onb-progress-fill{ height:100%; background:var(--gold); transition:width .3s ease; }
  .onb-step{ display:none; flex:1; flex-direction:column; justify-content:center; padding:36px 24px; text-align:center; gap:18px; }
  .onb-step.active{ display:flex; }
  .onb-eyebrow{ font-size:11px; letter-spacing:3px; color:var(--gold); text-transform:uppercase; }
  .onb-step h2{ font-family:var(--font-display); font-size:23px; color:var(--navy); line-height:1.35; font-weight:normal; }
  .onb-step p.sub{ font-size:14px; color:var(--navy-soft); line-height:1.6; }
  .onb-input{ width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:12px; font-size:15px; font-family:var(--font-body); text-align:center; background:#fff; color:var(--navy); }
  .onb-options{ display:flex; flex-direction:column; gap:10px; text-align:left; }
  .onb-opt{ width:100%; padding:14px 16px; border:1px solid var(--border); border-radius:12px; background:#fff; color:var(--navy); font-size:14px; text-align:left; cursor:pointer; font-family:var(--font-body); }
  .onb-opt.selected{ border-color:var(--gold); background:var(--gold-soft); color:#8a6a1f; font-weight:600; }
  .onb-btn{ background:var(--navy); color:#fff; border:none; padding:14px 20px; border-radius:12px; font-size:15px; font-weight:600; cursor:pointer; font-family:var(--font-body); }
  .onb-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .onb-back{ background:none; border:none; color:var(--navy-soft); font-size:13px; cursor:pointer; padding:6px; }
  .onb-summary-row{ display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border); font-size:13px; text-align:left; }
  .onb-summary-row b{ color:var(--navy); }
  .onb-included{ text-align:left; background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px; }
  .onb-included li{ font-size:13px; color:var(--navy-soft); margin-bottom:8px; list-style:none; padding-left:20px; position:relative; }
  .onb-included li:before{ content:"✓"; color:var(--gold); position:absolute; left:0; font-weight:700; }
</style>
</head>
<body>

<div class="onb" id="onbRoot">
  <div class="onb-progress"><div class="onb-progress-fill" id="onbProgressFill"></div></div>
  <div id="onbSteps"></div>
</div>

<div class="app" id="mainApp" style="display:none">
  <header>
    <button type="button" class="acct-btn" id="acctBtn" onclick="switchPage('conta')">Entrar</button>
    <div class="eyebrow">Sabedoria para o dia a dia</div>
    <h1>70 Conselhos de Salomão</h1>
    <div class="greet" id="greetLine"></div>
    <div class="streak">🔥 <b id="streakCount">0</b> dias seguidos</div>
  </header>

  <nav class="tabs" id="mainTabs">
    <button data-page="inicio" class="active">Início</button>
    <button data-page="jornada">Jornada</button>
    <button data-page="conselhos">Conselhos</button>
    <button data-page="conquistas">Conquistas</button>
  </nav>

  <main>
    <section class="page active" id="page-inicio"></section>

    <section class="page" id="page-jornada"></section>

    <section class="page" id="page-conselhos">
      <nav class="subtabs" id="subTabsConselhos">
        <button data-view="hoje" class="active">Hoje</button>
        <button data-view="todos">Todos</button>
        <button data-view="favoritos">Favoritos</button>
      </nav>
      <section class="view active" id="view-hoje"></section>
      <section class="view" id="view-todos">
        <div class="progress-row" id="progressRow"></div>
        <div class="filters" id="filters"></div>
        <div id="listTodos"></div>
      </section>
      <section class="view" id="view-favoritos">
        <div id="listFavoritos"></div>
      </section>
    </section>

    <section class="page" id="page-conquistas"></section>

    <section class="page" id="page-premium"></section>

    <section class="page" id="page-conta"></section>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const CONSELHOS = [
  {t:"Poupe quando pode, não só quando sobra.", c:"dinheiro"},
  {t:"Educar um filho com paciência rende mais que impor com grito.", c:"familia"},
  {t:"Quem planeja com calma prospera; quem corre decide mal.", c:"trabalho"},
  {t:"Amizade de verdade se prova nas horas difíceis, não nas fáceis.", c:"amizade"},
  {t:"Não fale no calor da raiva — espere, e sua resposta será mais sábia.", c:"palavras"},
  {t:"Orgulho cega; humildade enxerga o que precisa mudar.", c:"humildade"},
  {t:"Dívida que cresce sem controle rouba a paz antes de roubar o bolso.", c:"dinheiro"},
  {t:"Generosidade sincera volta pra quem a pratica, de um jeito ou de outro.", c:"familia"},
  {t:"Trabalho feito com cuidado hoje evita arrependimento amanhã.", c:"trabalho"},
  {t:"Amigo de verdade diz o que você precisa ouvir, não só o que você quer ouvir.", c:"amizade"},
  {t:"Ouça mais do que fala — é assim que se aprende de verdade.", c:"palavras"},
  {t:"Quem aceita conselho cresce; quem só defende sua opinião estagna.", c:"humildade"},
  {t:"Riqueza ganha depressa escorre pelos dedos; riqueza construída com paciência fica.", c:"dinheiro"},
  {t:"Tempo de qualidade não substitui tempo de verdade — os filhos sabem a diferença.", c:"familia"},
  {t:"Planeje o dia de manhã; a noite já é tarde pra decidir com clareza.", c:"trabalho"},
  {t:"Cercar-se de gente sábia é um dos atalhos mais seguros pra crescer.", c:"amizade"},
  {t:"Uma palavra gentil acalma o que a briga não resolve.", c:"palavras"},
  {t:"A inveja adoece quem a sente, não quem é invejado.", c:"humildade"},
  {t:"Gastar pra impressionar quem nem repara é o jeito mais caro de ficar pobre.", c:"dinheiro"},
  {t:"Uma casa em paz vale mais que uma casa em ordem.", c:"familia"},
  {t:"Fazer bem o que ninguém está vendo é o que forma o caráter que todos acabam vendo.", c:"trabalho"},
  {t:"Uma amizade que só pede e nunca oferece cansa antes do tempo.", c:"amizade"},
  {t:"Fofoca destrói mais rápido do que qualquer mentira contada de frente.", c:"palavras"},
  {t:"Admitir o erro antes que alguém aponte é o caminho mais rápido pra consertar.", c:"humildade"},
  {t:"Antes de comprar, pergunte se é necessidade ou impulso — a resposta honesta economiza meses de trabalho.", c:"dinheiro"},
  {t:"Perdoar dentro de casa primeiro é o que sustenta perdoar lá fora.", c:"familia"},
  {t:"Trocar de direção não é fracasso quando o caminho antigo já não leva a lugar nenhum.", c:"trabalho"},
  {t:"Celebrar a vitória do outro sem inveja é teste de amizade madura.", c:"amizade"},
  {t:"Palavra solta não volta — pense antes de falar o que não dá pra desfalar.", c:"palavras"},

async function refreshPremiumStatus(){
  authPremium = false;
  if (!authSession) { updateAcctBtn(); return; }
  try{
    const { data, error } = await supabaseClient
      .from("salomao_access_grants")
      .select("id")
      .eq("user_id", authSession.user.id)
      .eq("granted", true)
      .limit(1);
    if (!error && data && data.length) authPremium = true;
  } catch(e){ /* sem internet ou RLS bloqueando — trata como não-premium */ }
  updateAcctBtn();
}

window.authSetMode = function(mode){ authMode = mode; authError = ""; renderConta(); };

window.authSubmit = async function(){
  var email = (document.getElementById("acctEmail")||{}).value || "";
  var pass = (document.getElementById("acctPass")||{}).value || "";
  authError = "";
  if (!email || !pass){ authError = "Preencha e-mail e senha."; renderConta(); return; }
  if (pass.length < 6){ authError = "A senha precisa ter pelo menos 6 caracteres."; renderConta(); return; }
  authBusy = true; renderConta();
  try{
    if (authMode === "signup"){
      const { data, error } = await supabaseClient.auth.signUp({ email: email, password: pass });
      if (error) throw error;
      authSession = data.session || null;
      if (!authSession){
        authBusy = false;
        authError = "";
        document.getElementById("page-conta").innerHTML = '<button type="button" class="prem-back" onclick="switchPage(\'inicio\')">← voltar</button>' +
          '<div class="acct-card"><div class="acct-ok">Conta criada! Verifique seu e-mail pra confirmar antes de entrar.</div></div>';
        return;
      }
    } else {
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email: email, password: pass });
      if (error) throw error;
      authSession = data.session;
    }
    await supabaseClient.from("salomao_profiles").upsert({
      id: authSession.user.id,
      nome: state.onb.nome || null,
      momento: state.onb.momento || null,
      deseja: state.onb.deseja || null,
      tempo: state.onb.tempo || null,
      horario: state.onb.horario || null
    });
    await refreshPremiumStatus();
    authBusy = false;
    switchPage("conta");
  } catch(e){
    authBusy = false;
    authError = (e && e.message) ? e.message : "Não foi possível entrar. Tente de novo.";
    renderConta();
  }
};

window.authLogout = async function(){
  await supabaseClient.auth.signOut();
  authSession = null; authPremium = false;
  updateAcctBtn();
  switchPage("inicio");
};

    document.getElementById("page-conta").innerHTML = '<button type="button" class="prem-back" onclick="switchPage(\'inicio\')">← voltar</button>' +

window.onbSelectSingle = function(field, value, el){
  state.onb[field] = value;
  onbSave();
  var group = el.parentElement;
  Array.prototype.forEach.call(group.children, function(c){ c.classList.remove("selected"); });
  el.classList.add("selected");
  onbRenderNavState();
};
window.onbNomeInput = function(el){
  state.onb.nome = el.value;
  onbSave();
  onbRenderNavState();
};
function onbRenderNavState(){
  var btn = document.getElementById("onbNextBtn");
  if (!btn) return;
  var step = state.onb.step;
  var ok = true;
  if (step===2) ok = (state.onb.nome||"").trim().length>0;
  if (step===3) ok = !!state.onb.momento;
  if (step===4) ok = !!state.onb.deseja;
  if (step===5) ok = !!state.onb.tempo;
  if (step===6) ok = !!state.onb.horario;
  btn.disabled = !ok;
}
function onbOptionsHtml(field, options, current){
  return '<div class="onb-options">' + options.map(function(o){
    return '<button type="button" class="onb-opt'+(current===o?' selected':'')+'" onclick="onbSelectSingle(\''+field+'\',\''+o.replace(/'/g,"\\'")+'\',this)">'+o+'</button>';
  }).join("") + '</div>';
}
function onbStepHtml(step){
  var nome = state.onb.nome || "";
  if (step===1){
    return '<div class="onb-eyebrow">70 Conselhos de Salomão</div>' +

  }
  if (step===2){
    return '<h2>Como podemos chamar você?</h2>' +
      '<input type="text" class="onb-input" placeholder="Seu nome" value="'+nome.replace(/"/g,"&quot;")+'" oninput="onbNomeInput(this)" autofocus>' +
      onbNavButtonsHtml();
  }
  if (step===3){
    return '<h2>Qual momento você está vivendo?</h2>' +
      onbOptionsHtml("momento", MOMENTOS, state.onb.momento) +
      onbNavButtonsHtml();
  }
  if (step===4){
    return '<h2>O que você deseja desenvolver?</h2>' +
      onbOptionsHtml("deseja", DESEJOS, state.onb.deseja) +
      onbNavButtonsHtml();
  }
  if (step===5){
    return '<h2>Quanto tempo você consegue dedicar diariamente?</h2>' +
      onbOptionsHtml("tempo", TEMPOS, state.onb.tempo) +
      onbNavButtonsHtml();
  }
  if (step===6){
    return '<h2>Qual horário combina mais com sua rotina?</h2>' +
      onbOptionsHtml("horario", HORARIOS, state.onb.horario) +
      onbNavButtonsHtml();
  }
  if (step===7){
    return '<div class="onb-eyebrow">Antes de começar</div>' +
      '<h2>'+(nome?nome+', a':'A')+' partir de hoje, você não está sozinho(a) nessa caminhada.</h2>' +
      '<p class="sub">Um passo por dia é suficiente — não precisa ser perfeito, só constante. Estamos aqui pra te acompanhar nisso.</p>' +
      '<button type="button" class="onb-btn" onclick="onbGoto(8)">Continuar</button>' +
      '<button type="button" class="onb-back" onclick="onbGoto(6)">← voltar</button>';

    return '<h2>Esta é sua jornada, '+(nome||"")+'!</h2>' +
      '<div class="onb-summary-row"><span>Objetivo escolhido</span><b>'+(state.onb.deseja||"—")+'</b></div>' +
      '<div class="onb-summary-row"><span>Plano recomendado</span><b>Jornada de 7 dias</b></div>' +

  }
  return "";

function onbNavButtonsHtml(){
  return '<div style="display:flex;flex-direction:column;gap:8px">' +
    '<button type="button" class="onb-btn" id="onbNextBtn" onclick="onbGoto('+(state.onb.step+1)+')">Continuar</button>' +

  '</div>';
}
function onbRender(){
  var step = state.onb.step;

window.onbFinish = function(){

const BADGES = [
  { key:"primeira_semente", nome:"Primeira Semente", desc:"Ganhe seus primeiros pontos", check:function(s){ return s.points>0; } },
  { key:"sete_dias", nome:"Sete Dias de Constância", desc:"7 dias seguidos de presença no app", check:function(s){ return s.streak>=7; } },
  { key:"amante_palavra", nome:"Amante da Palavra", desc:"Favorite 10 conselhos", check:function(s){ return Object.keys(s.favorites).length>=10; } },
  { key:"coracao_grato", nome:"Coração Grato", desc:"Conclua o dia de gratidão da jornada", check:function(s){ return !!(s.journey7.completedDays && s.journey7.completedDays[3]); } },
  { key:"jornada_completa", nome:"Jornada Completa", desc:"Conclua os 7 dias da Jornada de 7 dias", check:function(s){ return [1,2,3,4,5,6,7].every(function(d){ return s.journey7.completedDays && s.journey7.completedDays[d]; }); } }
];
const LEVELS = [
  { min:0, nome:"Semente" },
  { min:50, nome:"Broto" },
  { min:150, nome:"Raiz Firme" },
  { min:300, nome:"Árvore Frutífera" },
  { min:600, nome:"Floresta de Sabedoria" }
];
function currentLevel(points){
  var lvl = LEVELS[0];
  for (var i=0;i<LEVELS.length;i++){ if (points>=LEVELS[i].min) lvl = LEVELS[i]; }
  return lvl;
}
function journeyCompletedCount(){
  var c = 0;
  for (var d=1; d<=7; d++){ if (state.journey7.completedDays[d]) c++; }
  return c;
}
function journeyCurrentDay(){
  for (var d=1; d<=7; d++){ if (!state.journey7.completedDays[d]) return d; }
  return 7;
}

function verseBoxHtml(j){
  return '<div class="verse-box">' +
    '<div class="txt">“'+j.verseText+'”</div>' +
    '<div class="ref">'+j.verseRef+'</div>' +
    '<div class="tr">'+TRADUCAO+'</div>' +

}
function momentDetailHtml(j){
  var done = !!state.journey7.completedDays[j.day];
  var note = state.journey7.notes[j.day] || "";
  return '<div class="moment-detail">' +
    '<div class="kicker">Dia '+j.day+' de 7 · '+j.tema+'</div>' +
    '<h3>'+j.title+'</h3>' +

      '<button type="button" class="btn primary" style="width:100%" onclick="completeJourneyDay('+j.day+')">CONCLUIR MEU MOMENTO</button>'
    ) +
  '</div>';
}
window.toggleJourneyDay = function(day){
  state.journey7.openDay = (state.journey7.openDay===day) ? null : day;
  renderJornada();
};
window.completeJourneyDay = function(day){
  if (!state.journey7.completedDays[day]){
    state.journey7.completedDays[day] = true;
    state.journey7.completedDates[day] = new Date().toISOString().slice(0,10);
    state.points += 15;
  }
  save(state);
  renderJornada();
  renderInicio();
};
document.addEventListener("input", function(e){
  var ta = e.target.closest("textarea[data-journey-note]");
  if (!ta) return;
  var day = Number(ta.dataset.journeyNote);
  clearTimeout(ta._t);
  ta._t = setTimeout(function(){
    state.journey7.notes[day] = ta.value;
    save(state);
  }, 500);
});
function journalListHtml(){
  var days = Object.keys(state.journey7.completedDates).map(Number).sort(function(a,b){ return state.journey7.completedDates[b].localeCompare(state.journey7.completedDates[a]); });
  if (!days.length) return '<div class="empty">Suas reflexões da jornada aparecem aqui conforme você concluir cada dia.</div>';
  return days.map(function(d){
    var j = JOURNEY7_DATA[d-1];
    var note = state.journey7.notes[d];
    return '<div class="journal-entry"><div class="d">'+state.journey7.completedDates[d]+' · Dia '+d+' · '+j.tema+'</div>' +
      (note ? '<div class="t">'+note.replace(/</g,"&lt;")+'</div>' : '<div class="t" style="color:var(--navy-soft)">(sem anotação escrita)</div>') +
    '</div>';
  }).join("");
}
function renderJornada(){
  var el = document.getElementById("page-jornada");
  var count = journeyCompletedCount();
  var rows = JOURNEY7_DATA.map(function(j){
    var done = !!state.journey7.completedDays[j.day];
    var open = state.journey7.openDay===j.day;
    return '<div class="journey-day-row'+(done?' done':'')+'" onclick="toggleJourneyDay('+j.day+')">' +
      '<div class="num">'+(done?'✓':j.day)+'</div>' +
      '<div class="info"><div class="title">'+j.title+'</div><div class="theme">'+j.tema+'</div></div>' +
      '<div class="check">'+(open?'−':'+')+'</div>' +
    '</div>' + (open ? momentDetailHtml(j) : '');
  }).join('<div style="height:2px"></div>');
  el.innerHTML =
    '<div><div class="section-title">Jornada de 7 dias</div><div class="section-sub">'+count+' de 7 dias concluídos · comece por qualquer dia</div></div>' +
    '<div style="display:flex; flex-direction:column; gap:10px">' + rows + '</div>' +
    '<div><div class="section-title">Seu diário dessa jornada</div><div class="section-sub">suas reflexões escritas ao concluir cada dia</div></div>' +
    journalListHtml();
}

// ===================== streak =====================
(function updateStreak(){
  const today = new Date().toISOString().slice(0,10);
  if(state.lastOpen !== today){
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    state.streak = (state.lastOpen === yesterday) ? state.streak + 1 : 1;
    state.lastOpen = today;
    save(state);
  }
})();

function dayIndex(){
  const start = new Date(state.startDate);
  const today = new Date(new Date().toISOString().slice(0,10));
  const diff = Math.floor((today - start) / 86400000);
  return diff % CONSELHOS.length;
}

let currentFilter = "todos";

function renderHoje(){
  const idx = dayIndex();
  const item = CONSELHOS[idx];
  const isFav = !!state.favorites[idx];
  const reflection = state.reflections[idx] || "";
  document.getElementById("view-hoje").innerHTML = `
    <div class="today-card">
      <div class="today-day">Dia ${idx+1} de ${CONSELHOS.length}</div>
      <div class="today-cat">${CATS[item.c]}</div>
      <div class="today-text">"${item.t}"</div>
      <div class="today-actions">
        <button class="btn fav ${isFav?'active':''}" onclick="toggleFav(${idx})">${isFav?'★ Favoritado':'☆ Favoritar'}</button>
      </div>
      <div class="reflect">
        <label>Sua reflexão (só você vê, fica salva no seu aparelho)</label>
        <textarea id="reflectInput" placeholder="O que esse conselho significa pra você hoje?">${reflection}</textarea>
        <div class="saved-note" id="savedNote"></div>
      </div>
    </div>
  `;
  document.getElementById("streakCount").textContent = state.streak;
  const ta = document.getElementById("reflectInput");
  let t;
  ta.addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      state.reflections[idx] = ta.value;
      save(state);
      const note = document.getElementById("savedNote");
      note.textContent = "Salvo.";
      setTimeout(()=>{ if(note) note.textContent=""; }, 1500);
    }, 500);
  });
}

window.toggleFav = function(idx){
  if(state.favorites[idx]) delete state.favorites[idx];
  else state.favorites[idx] = true;
  save(state);
  renderHoje(); renderTodos(); renderFavoritos();
};

// ---------- top-level page nav (Início / Jornada / Conselhos / Conquistas) ----------
function switchPage(name){
  document.querySelectorAll("#mainTabs button").forEach(function(b){ b.classList.toggle("active", b.dataset.page===name); });
  document.querySelectorAll("main > .page").forEach(function(v){ v.classList.remove("active"); });
  var target = document.getElementById("page-"+name);
  if (target) target.classList.add("active");
  window.scrollTo({top:0, behavior:"smooth"});
  if (name==="inicio") renderInicio();
  if (name==="jornada") renderJornada();
  if (name==="conquistas") renderConquistas();
  if (name==="premium") renderPremium();
  if (name==="conta") renderConta();
}
window.switchPage = switchPage;
document.getElementById("mainTabs").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-page]");
  if (!btn) return;
  switchPage(btn.dataset.page);
});

// ---------- sub nav inside Conselhos (Hoje / Todos / Favoritos) ----------
function switchView(name){
  var target = document.getElementById("view-"+name);
  if (!target) return;
  document.querySelectorAll("#subTabsConselhos button").forEach(function(b){ b.classList.toggle("active", b.dataset.view===name); });
  document.querySelectorAll("#page-conselhos .view").forEach(function(v){ v.classList.remove("active"); });
  target.classList.add("active");
}
window.switchView = switchView;
document.getElementById("subTabsConselhos").addEventListener("click", function(e){
  var btn = e.target.closest("button[data-view]");
  if (!btn) return;
  switchView(btn.dataset.view);
});

// ===================== boot =====================
if (state.onb.done){ showMainApp(); } else { showOnboarding(); }

supabaseClient.auth.getSession().then(function(res){
  authSession = res.data.session;
  updateAcctBtn();
  refreshPremiumStatus();
});
supabaseClient.auth.onAuthStateChange(function(_event, session){
  authSession = session;
  updateAcctBtn();
  refreshPremiumStatus();
  var contaPage = document.getElementById("page-conta");
  if (contaPage && contaPage.classList.contains("active")) renderConta();
});
</script>
