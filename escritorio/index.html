// ----- utilidades de textura -----
function makeCanvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const tex = new THREE.CanvasTexture(c);
  return { c, ctx, tex, draw: () => { draw(ctx, w, h); tex.needsUpdate = true; } };
}
function wrapText(ctx, text, x, y, maxW, lh){
  const words = String(text).split(' '); let line = ''; let yy = y;
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
}
function hex(c){ return '#' + c.toString(16).padStart(6,'0'); }

// ----- quadro com moldura -----
function framed(tex, w, h, x, y, z, rotY, frameColor=0x8a5a2b){
  const g = new THREE.Group();
  const fr = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, h + 0.3, 0.12), mat(frameColor));
  const pl = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, roughness:0.8 }));
  pl.position.z = 0.07;
  g.add(fr, pl);
  g.position.set(x, y, z); g.rotation.y = rotY;
  scene.add(g);
}
// arte abstrata original (composições geométricas, sem copiar obras existentes)
function artDraw(style, seed){
  return (ctx, w, h) => {
    let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
    if (style === 'circles'){
      ctx.fillStyle = '#f3ece0'; ctx.fillRect(0,0,w,h);
      const cols = ['#e4572e','#2b59c3','#f2b134','#2a9d8f','#264653'];
      for (let i=0;i<18;i++){ ctx.beginPath(); ctx.fillStyle = cols[i%cols.length]; ctx.globalAlpha = .75; ctx.arc(rnd()*w, rnd()*h, 20+rnd()*120, 0, Math.PI*2); ctx.fill(); }
      ctx.globalAlpha = 1;
    } else if (style === 'grid'){
      ctx.fillStyle = '#fbfaf5'; ctx.fillRect(0,0,w,h);
      const cols = ['#d62828','#fcbf49','#003049','#eae2b7'];
      ctx.lineWidth = 14; ctx.strokeStyle = '#111';
      for (let i=0;i<7;i++){ const x = rnd()*w, y = rnd()*h, ww = 60+rnd()*160, hh = 60+rnd()*160; ctx.fillStyle = cols[i%cols.length]; ctx.fillRect(x,y,ww,hh); ctx.strokeRect(x,y,ww,hh); }
      for (let i=0;i<6;i++){ ctx.beginPath(); ctx.moveTo(rnd()*w,0); ctx.lineTo(rnd()*w,h); ctx.stroke(); }
    } else if (style === 'waves'){
      ctx.fillStyle = '#1d3557'; ctx.fillRect(0,0,w,h);
      for (let k=0;k<14;k++){
        ctx.beginPath(); ctx.strokeStyle = `hsl(${(k*27+seed)%360} 70% 65%)`; ctx.lineWidth = 6;
        for (let x=0;x<=w;x+=8){ const y = h*(k/14) + Math.sin(x/60 + k)*18*(1+k/6); x===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); }
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = '#f7e7ce'; ctx.fillRect(0,0,w,h);
      for (let i=0;i<260;i++){ ctx.beginPath(); ctx.fillStyle = `hsl(${rnd()*60+10} 70% ${40+rnd()*40}%)`; ctx.arc(rnd()*w, rnd()*h, 4+rnd()*14, 0, Math.PI*2); ctx.fill(); }
    }
  };
}
function artPiece(style, seed, x, y, z, rotY, w=2.6, h=2.0){
  const t = makeCanvasTex(512, 400, artDraw(style, seed));
  t.draw();
  framed(t.tex, w, h, x, y, z, rotY, 0x2b2b3d);
}
function quoteFrame(text, x, y, z, rotY){
  const t = makeCanvasTex(512, 320, (ctx, w, h) => {
    ctx.fillStyle = '#fbf7ec'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#5468e0'; ctx.lineWidth = 12; ctx.strokeRect(16,16,w-32,h-32);
    ctx.fillStyle = '#2b2b3d'; ctx.font = 'italic 44px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    wrapText(ctx, '“' + text + '”', w/2, h/2 - 10, w - 90, 54);
  });
  t.draw();
  framed(t.tex, 3.0, 1.9, x, y, z, rotY, 0x5468e0);
}

// ===== salas: paredes, placa de título, mesa, cadeira, decoração =====
function buildRoom(id){
  const R = ROOMS[id], a = agentById[id], acc = a.color;
  const W = ROOM_W, d = R.d;
  const back = R.cz - d/2, front = R.cz + d/2;
  R.back = back; R.front = front;
  R.chair = new THREE.Vector3(R.cx, 0, R.cz + 1.3);
  R.deskZ = R.cz - 1.2;

  // piso da sala com cor do agente
  const fl = new THREE.Mesh(new THREE.BoxGeometry(W-0.2, 0.06, d-0.2), mat(new THREE.Color(acc).lerp(new THREE.Color(0xffffff), 0.65)));
  fl.position.set(R.cx, 0.03, R.cz); fl.receiveShadow = true; scene.add(fl);

  const H = 2.6;
  const addWall = (x, z, w, dd) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, H, dd), wallMat);
    m.position.set(x, H/2, z); m.castShadow = true; m.receiveShadow = true; scene.add(m);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(w + 0.02, 0.14, dd + 0.02), mat(acc));
    cap.position.set(x, H + 0.07, z); scene.add(cap);
  };
  // paredes divisórias (paredes externas do prédio já são o fundo/lateral nas salas de borda)
  if (R.cx !== EDGE_L) addWall(R.cx - W/2, R.cz, 0.3, d);
  if (R.cx !== EDGE_R) addWall(R.cx + W/2, R.cz, 0.3, d);
  if (R.row === 'B') addWall(R.cx, back, W, 0.3);

  // placa com título e área de cada sala (sobre a abertura da frente)
  const sign = makeCanvasTex(768, 200, (ctx, w, h) => {
    ctx.fillStyle = hex(acc); ctx.fillRect(0,0,w,h);
    ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(0,0,w,h/2);
    ctx.fillStyle = '#ffffff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 52px IBM Plex Sans, sans-serif'; ctx.fillText(R.title, w/2, 68);
    ctx.font = '32px IBM Plex Sans, sans-serif'; ctx.fillText(R.role, w/2, 140);
  });
  sign.draw();
  const plate = new THREE.Mesh(new THREE.PlaneGeometry(6.4, 1.67), new THREE.MeshStandardMaterial({ map: sign.tex, emissive:0x111111 }));
  plate.position.set(R.cx, 3.5, front + 0.05); scene.add(plate);

  // mesa, monitor e cadeira
  const desk = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.3, 1.8), mat(0xa9733f));
  desk.position.set(R.cx, 1.6, R.deskZ); desk.castShadow = true; scene.add(desk);
  const mon = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.1), mat(0x2a2d3a, { emissive:0x1a3c66, emissiveIntensity:0.35 }));
  mon.position.set(R.cx, 2.5, R.deskZ - 0.5); scene.add(mon);
  const chair = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.2, 1.1), mat(0x3a3d52));
  chair.position.set(R.cx, 0.6, R.cz + 1.3); chair.castShadow = true; scene.add(chair);

  // decoração: planta num canto de trás, flores no canto da frente
  leafyPlant(R.cx + 3.2, back + 0.9, 0.9);
  flowers(R.cx - 3.2, front - 0.9);
}

// quadro de metas/ telão mantidos em posições fixas
function drawTelao(ctx, w, h){
  // fundo claro e letras grandes, para ler de longe
  ctx.fillStyle = '#f7f5ef'; ctx.fillRect(0,0,w,h);
  ctx.fillStyle = '#3f52c9'; ctx.fillRect(0,0,w,120);
  ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = 'bold 56px IBM Plex Sans, sans-serif';
  const dt = new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
  ctx.fillText('TAREFAS DE HOJE · ' + dt, 40, 62);
  const tasks = allTasks();
  const todo = tasks.filter(t => !t.done), done = tasks.filter(t => t.done);
  ctx.font = 'bold 42px IBM Plex Sans, sans-serif';
  ctx.fillStyle = '#c4641d'; ctx.fillText('A FAZER (' + todo.length + ')', 40, 170);
  ctx.fillStyle = '#1f7a4d'; ctx.fillText('CONCLUÍDO (' + done.length + ')', 620, 170);
  ctx.strokeStyle = '#d8d2c2'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(600, 140); ctx.lineTo(600, h-150); ctx.stroke();
  ctx.font = '32px IBM Plex Sans, sans-serif'; ctx.fillStyle = '#2b2b3d';
  const fmt = t => t.agent.name.split(' ')[0] + ' · ' + t.offer.title;
  if (todo.length) todo.slice(0,5).forEach((t,i) => ctx.fillText('• ' + fmt(t).slice(0,36), 40, 235 + i*58));
  else ctx.fillText('Nada pendente. Bom trabalho.', 40, 235);
  if (done.length) done.slice(0,5).forEach((t,i) => ctx.fillText('✓ ' + fmt(t).slice(0,34), 620, 235 + i*58));
  else ctx.fillText('Ainda nada concluído hoje.', 620, 235);
  const u = loadUltimo();
  ctx.fillStyle = '#2b2b3d'; ctx.fillRect(0, h-120, w, 120);
  ctx.fillStyle = '#ffd166'; ctx.font = 'bold 34px IBM Plex Sans, sans-serif';
  ctx.fillText('ÚLTIMO PEDIDO À IA', 40, h-88);
  ctx.fillStyle = '#ffffff'; ctx.font = '30px IBM Plex Sans, sans-serif';
  if (u) { ctx.fillText(u.agente + ' · ' + new Date(u.hora).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}), 40, h-50); }
  else ctx.fillText('Nenhum pedido ainda. Clique num agente e peça algo.', 40, h-50);
}
function drawMeta(ctx, w, h){
  ctx.fillStyle = '#fbf7ec'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#2b2b3d'; ctx.lineWidth = 10; ctx.strokeRect(8,8,w-16,h-16);
  ctx.fillStyle = '#5468e0'; ctx.font = 'bold 40px IBM Plex Sans, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('META DO MÊS', w/2, 60);
  ctx.fillStyle = '#2b2b3d'; ctx.font = 'bold 110px IBM Plex Sans, sans-serif';
  ctx.fillText(metaVendas + ' / ' + META_TARGET, w/2, 210);
  ctx.font = '36px IBM Plex Sans, sans-serif'; ctx.fillText('vendas', w/2, 280);
  const pct = metaVendas / META_TARGET;
  ctx.fillStyle = '#e4dccb'; ctx.fillRect(50, 340, w-100, 60);
  ctx.fillStyle = '#3fb27f'; ctx.fillRect(50, 340, (w-100)*pct, 60);
  ctx.strokeStyle = '#2b2b3d'; ctx.lineWidth = 4; ctx.strokeRect(50, 340, w-100, 60);
  ctx.fillStyle = '#2b2b3d'; ctx.font = '26px IBM Plex Sans, sans-serif';
  ctx.fillText(Math.round(pct*100) + '% da meta', w/2, 440);
}

function makeCharacter(a){
  const g = new THREE.Group();
  const skin = mat(a.skin), shirt = mat(a.color), pants = mat(0x2b2f44), hair = mat(a.hair);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), skin); head.position.y = 2.2; head.castShadow = true;
  const hairM = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 12, 0, Math.PI*2, 0, Math.PI*0.55), hair); hairM.position.y = 2.35;
  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.5), shirt); torso.position.y = 1.2; torso.castShadow = true;
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.0, 0.28), shirt); armL.position.set(-0.6, 1.2, 0);
  const armR = new THREE.Mesh(new THREE.BoxGeometry(0.28, 1.0, 0.28), shirt); armR.position.set(0.6, 1.2, 0);
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.0, 0.34), pants); legL.position.set(-0.22, 0.4, 0);
  const legR = new THREE.Mesh(new THREE.BoxGeometry(0.34, 1.0, 0.34), pants); legR.position.set(0.22, 0.4, 0);
  g.add(head, hairM, torso, armL, armR, legL, legR);
  g.userData = { armL, armR, legL, legR };
  return g;
}

// ===== dados e tarefas =====
function nextStep(progress){ const p = progress || {}; return STEP_ORDER.find(s => !p[s]) || null; }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function taskKey(agentId, title){ return agentId + '|' + title; }
function allTasks(){
  const list = [];
  agents.forEach(a => (assignments[a.id] || []).forEach(o => {
    const key = taskKey(a.id, o.title);
    list.push({ key, agent:a, offer:o, done: doneSet.has(key) });
  }));
  return list;
}
function applyOffers(offers){
  offersCache = offers;
  assignments = {};
  agents.forEach(a => assignments[a.id] = []);
  offers.forEach(o => {
    if (o.status === 'ativa') { assignments['pixel'].push(o); return; }
    const s = nextStep(o.progress);
    if (s && assignments[s]) assignments[s].push(o);
  });
  agents.forEach(a => chars[a.id].userData.mode = assignments[a.id].length ? 'work' : 'idle');
  refreshUI();
}
function refreshUI(){
  renderSide(); renderOverlay();
  const working = agents.filter(a => assignments[a.id] && assignments[a.id].length).length;
  document.getElementById('hud').innerHTML = `ofertas: <b>${offersCache.length}</b> · trabalhando: <b>${working}/${agents.length}</b> · concluídas hoje: <b>${allTasks().filter(t=>t.done).length}</b>`;
  document.getElementById('metaVal').textContent = `${metaVendas} / ${META_TARGET}`;
  telao.draw();
}
function renderSide(){
  const box = document.getElementById('tasks');
  const tasks = allTasks();
  box.innerHTML = tasks.length ? tasks.map((t, i) => `
    <div class="task ${t.done ? 'done' : ''}" data-i="${i}">
      <span class="who" style="background:${hex(t.agent.color)}">${esc(t.agent.name)}</span>
      <div class="what">${t.done ? '✓ ' : ''}${esc(t.offer.title)}</div>
      <div class="meta">${esc(t.offer.status)}</div>
    </div>`).join('') : '<p class="empty">Nenhuma tarefa ativa agora.</p>';
  box.querySelectorAll('.task').forEach(el => el.addEventListener('click', () => openPanel(tasks[+el.dataset.i])));
}

const overlay = document.getElementById('overlay');
const tboxes = {};
agents.forEach(a => { const d = document.createElement('div'); d.className = 'tbox'; overlay.appendChild(d); tboxes[a.id] = d; });
function renderOverlay(){
  agents.forEach(a => {
    const d = tboxes[a.id];
    const list = assignments[a.id] || [];
    const tasksHtml = list.length ? list.slice(0,3).map(o => {
      const key = taskKey(a.id, o.title);
      return `<button class="tbtn ${doneSet.has(key) ? 'done' : ''}" data-key="${esc(key)}">${doneSet.has(key) ? '✓ ' : ''}${esc(o.title)}</button>`;
    }).join('') + (list.length > 3 ? `<span class="tlivre">+${list.length-3}</span>` : '') : '<span class="tlivre">livre</span>';
    d.innerHTML = tasksHtml + `<button class="tbtn ask" data-ask="${a.id}">💬 pedir</button>`;
    d.querySelectorAll('.tbtn[data-key]').forEach(b => b.addEventListener('click', () => {
      const t = allTasks().find(x => x.key === b.dataset.key); if (t) openPanel(t);
    }));
    d.querySelector('[data-ask]').addEventListener('click', () => openAsk(a));
  });
}

function openPanel(t){
  const card = document.getElementById('panelCard');
  card.innerHTML = `
    <button class="close" id="pClose">fechar ✕</button>
    <h3>${esc(t.agent.name)}</h3>
    <p><b>${esc(t.offer.title)}</b></p>
    <p>Status da oferta: ${esc(t.offer.status)}${t.offer.niche ? ' · '+esc(t.offer.niche) : ''}</p>
    ${t.offer.status === 'ativa' ? `<p>Vendas: ${esc(t.offer.sales)} · gasto: €${esc(t.offer.spent)}</p>` : ''}
    <p>${t.done ? 'Marcada como concluída por você.' : 'Pendente.'}</p>
    <div class="actions">
      <button id="pToggle">${t.done ? 'Desmarcar' : 'Marcar como concluída'}</button>
      <a href="${OFICINA_URL}" target="_blank" rel="noopener">Abrir na Oficina</a>
    </div>`;
  document.getElementById('panel').classList.add('show');
  document.getElementById('pClose').onclick = () => document.getElementById('panel').classList.remove('show');
  document.getElementById('pToggle').onclick = () => {
    if (doneSet.has(t.key)) doneSet.delete(t.key); else doneSet.add(t.key);
    saveDone(); document.getElementById('panel').classList.remove('show'); refreshUI();
  };
}
document.getElementById('panel').addEventListener('click', e => { if (e.target.id === 'panel') e.target.classList.remove('show'); });

let askAgent = null, lastResposta = '';
function openAsk(a){
  askAgent = a;
  const card = document.getElementById('askCard');
  card.innerHTML = `
    <button class="close" id="aClose">fechar ✕</button>
    <h3>${esc(a.name)}</h3>
    <p>Descreva o que você precisa. A resposta aparece aqui pra você copiar ou baixar.</p>
    <textarea id="askTxt" rows="5" placeholder="Ex: escreva 3 ângulos de copy pro Kit Devocional Católico"></textarea>
    <div class="actions">
      <button id="askSend">Enviar ao agente</button>
      <button id="askCopy" disabled>Copiar</button>
      <button id="askDl" style="display:none">Baixar .txt</button>
    </div>
    <div id="askOut"></div>`;
  document.getElementById('askModal').classList.add('show');
  document.getElementById('aClose').onclick = closeAsk;
  document.getElementById('askSend').onclick = sendAsk;
  document.getElementById('askCopy').onclick = () => navigator.clipboard?.writeText(lastResposta);
}
function closeAsk(){ document.getElementById('askModal').classList.remove('show'); }
document.getElementById('askModal').addEventListener('click', e => { if (e.target.id === 'askModal') closeAsk(); });
async function sendAsk(){
  const pedido = document.getElementById('askTxt').value.trim();
  if (!pedido || !askAgent) return;
  const out = document.getElementById('askOut');
  const btn = document.getElementById('askSend');
  btn.disabled = true; btn.textContent = 'trabalhando…';
  out.classList.add('show'); out.textContent = 'O agente está trabalhando no seu pedido…';
  chars[askAgent.id].userData.busy = true;
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/agente-chat`, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json' },
      body: JSON.stringify({ agente: askAgent.key, pedido })
    });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || ('HTTP '+res.status));
    lastResposta = data.resposta || '';
    out.textContent = lastResposta;
    document.getElementById('askCopy').disabled = false;
    const dl = document.getElementById('askDl');
    dl.style.display = 'inline-block';
    dl.onclick = async () => {
      const filename = 'resposta-' + askAgent.key + '.txt';
      const blob = new Blob([lastResposta], { type:'text/plain;charset=utf-8' });
      const downloads = await window.claude?.use?.('downloads');
      if (downloads) {
        try { await downloads.save({ filename, data: blob }); }
        catch (e) { out.textContent += '\n\n(download não concluído: ' + e.message + ')'; }
        return;
      }
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob); link.download = filename;
      document.body.appendChild(link); link.click(); link.remove();
    };
    saveUltimo({ agente: askAgent.name, hora: new Date().toISOString(), resumo: lastResposta.slice(0,140) });
    telao.draw();
  }catch(err){
    out.textContent = 'Não consegui: ' + err.message;
  }finally{
    chars[askAgent.id].userData.busy = false;
    btn.disabled = false; btn.textContent = 'Enviar ao agente';
  }
}

// meta manual
document.getElementById('metaMinus').onclick = () => { metaVendas = Math.max(0, metaVendas-1); saveMeta(); refreshUI(); metaTex.draw(); };
document.getElementById('metaPlus').onclick  = () => { metaVendas = Math.min(META_TARGET, metaVendas+1); saveMeta(); refreshUI(); metaTex.draw(); };
setInterval(() => { telao.draw(); metaTex.draw(); }, 2000);

// ===== carregamento =====
async function load(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/my_offers?select=title,niche,status,progress,sales,spent,created_at&order=created_at.desc`, {
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }

load();
setInterval(load, 60000);

// ===== movimento =====
function walkTo(ch, target, speed, dt){
  const dir = target.clone().sub(ch.position); dir.y = 0;
  const dist = dir.length();
  if (dist < 0.05) return true;
  dir.normalize();
  ch.position.addScaledVector(dir, Math.min(dist, speed*dt));
  ch.rotation.y = Math.atan2(dir.x, dir.z);
  return false;
}
function walkRoute(ch, u, speed, dt){
  if (!u.route.length) return true;
  if (walkTo(ch, u.route[0], speed, dt)) u.route.shift();
  return u.route.length === 0;
}
// separação entre personagens e de quem está sentado
function separate(){
  const list = agents.map(a => chars[a.id]);
  for (let i=0;i<list.length;i++) for (let j=i+1;j<list.length;j++){
    const A = list[i], B = list[j];
    if (A.userData.seated && B.userData.seated) continue;
    const d = new THREE.Vector3().subVectors(A.position, B.position); d.y = 0;
    const dist = d.length(), min = 1.6;
    if (dist > 0 && dist < min){
      const push = d.normalize().multiplyScalar((min - dist) * 0.5);
      if (!A.userData.seated) A.position.add(push);
      if (!B.userData.seated) B.position.sub(push);
    }
  }
}
function resize(){
  const w = container.clientWidth, h = container.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
const v = new THREE.Vector3();
function updateOverlayPositions(){
  const w = container.clientWidth, h = container.clientHeight;
  agents.forEach(a => {
    const ch = chars[a.id];
    v.copy(ch.userData.deskPos).project(camera);
    const d = tboxes[a.id];
    if (v.z > 1 || v.z < -1){ d.style.display = 'none'; return; }
    d.style.display = 'flex';
    d.style.left = ((v.x*0.5+0.5)*w) + 'px';
    d.style.top  = ((-v.y*0.5+0.5)*h) + 'px';
  });
}
function walkPose(ch, t){
  const { armL, armR, legL, legR } = ch.userData;
  const s = Math.sin(t*8)*0.6;
  legL.rotation.x = s; legR.rotation.x = -s; armL.rotation.x = -s*0.7; armR.rotation.x = s*0.7;
}
function stillPose(ch){
  const { armL, armR, legL, legR } = ch.userData;
  armL.rotation.x = 0; armR.rotation.x = 0; legL.rotation.x = 0; legR.rotation.x = 0;
}
function animate(){
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  agents.forEach(a => {
    const ch = chars[a.id], u = ch.userData;
    const { armL, armR, legL, legR } = u;
    const working = u.mode === 'work' || u.busy;

    if (working){
      if (!u.routeWork){
        u.routeWork = true; u.state = 'roam'; u.pause = 0;
        u.route = ch.position.z > 12 ? [...returnPath(u), u.chair.clone()] : [u.chair.clone()];
      }
      const arrived = walkRoute(ch, u, 2.4, dt);
      if (arrived){
        u.seated = true;
        ch.rotation.y += (Math.PI - ch.rotation.y) * 0.15;
        ch.position.y = 0.25;
        const k = Math.sin(t*12)*0.5;
        armL.rotation.x = -1.2 + k; armR.rotation.x = -1.2 - k;
        legL.rotation.x = -1.4; legR.rotation.x = -1.4;
      } else {
        u.seated = false;
        walkPose(ch, t);
        ch.position.y = 0;
      }
      return;
    }

    u.routeWork = false; u.seated = false; ch.position.y = 0;

    if (u.pause > 0){
      u.pause -= dt; stillPose(ch); return;
    }

    if (u.state === 'roam'){
      if (!u.route.length){
        if (Math.random() < 0.25){ u.route = [...exitPath(u), ppTarget(u)]; u.state = 'toPatio'; }
        else { u.route = [wanderPoint(u)]; }
      }
      const arrived = walkRoute(ch, u, 1.5, dt);
      if (arrived){ u.pause = 2 + Math.random()*4; stillPose(ch); }
      else walkPose(ch, t);
    }
    else if (u.state === 'toPatio'){
      const arrived = walkRoute(ch, u, 1.8, dt);
      if (arrived){ u.state = 'play'; u.pp = 0; }
      else walkPose(ch, t);
    }
    else if (u.state === 'play'){
      u.pp += dt;
      ch.rotation.y = u.ppSide ? Math.PI/2 : -Math.PI/2;
      armR.rotation.x = -1.3 + Math.sin(t*14)*0.9; armL.rotation.x = -0.5;
      legL.rotation.x = 0; legR.rotation.x = 0;
      if (u.pp > 6){ u.state = 'toHome'; u.route = [...returnPath(u), wanderPoint(u)]; }
    }
    else if (u.state === 'toHome'){
      const arrived = walkRoute(ch, u, 1.8, dt);
      if (arrived){ u.state = 'roam'; u.pause = 1.5; stillPose(ch); }
      else walkPose(ch, t);
    }
  });
  separate();
  controls.update();
  renderer.render(scene, camera);
  updateOverlayPositions();
  requestAnimationFrame(animate);
}
animate();
</script>
